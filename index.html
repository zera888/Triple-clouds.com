<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Triple-Clouds | 服務與試用申請</title>
  <style>
    /* 基礎頁面樣式與變數 */
    :root {
      --primary-color: #2563eb;
      --bg-color: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #475569;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
    }

    header {
      background-color: #ffffff;
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #e2e8f0;
    }

    header h1 {
      margin: 0;
      font-size: 1.5rem;
      color: var(--primary-color);
    }

    /* 區塊與響應式容器容器 */
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }

    .form-section {
      background: #ffffff;
      margin-top: 30px;
      padding: 30px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    .section-title {
      text-align: center;
      margin-top: 0;
      font-size: 1.75rem;
    }

    .section-desc {
      text-align: center;
      color: var(--text-muted);
      margin-bottom: 25px;
    }

    /* 確保 Google 表單在手機與電腦上皆置中且無邊框 */
    .iframe-wrapper {
      position: relative;
      width: 100%;
      overflow: hidden;
      display: flex;
      justify-content: center;
    }

    .iframe-wrapper iframe {
      width: 100%;
      max-width: 640px;
      height: 1100px;
      border: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>Triple-Clouds</h1>
  </header>

  <main class="container">
    <!-- 需求調查表單區塊 -->
    <section class="form-section" id="apply">
      <h2 class="section-title">Landing Page 潛在客戶需求調查</h2>
      <p class="section-desc">留下您的聯絡資訊，即可獲得 14 天免費試用與 1 對 1 企業專員設定諮詢。</p>
      
      <div class="iframe-wrapper">
        <iframe 
          src="https://docs.google.com/forms/d/e/1FAIpQLScU6Z0x4MyiCz8LIx_at25ir9aE1El_LQcRaOq0OqELmLLxtg/viewform?usp=publish-editor" 
          marginheight="0" 
          marginwidth="0">載入中…</iframe>
      </div>
    </section>
  </main>

</body>
</html>
